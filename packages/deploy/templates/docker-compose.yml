version: "3.8"

networks:
  agent-net:
    external: true

services:
  web:
    image: ${IMAGE_NAME:-my-client:prod}
    restart: unless-stopped
    networks:
      - agent-net
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      update_config:
        order: start-first
        failure_action: rollback
      restart_policy:
        condition: any
    environment:
      # ─── Next.js ──────────────────────────────────────────────────────────
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1

      # ─── Supabase (e-commerce) ────────────────────────────────────────────
      # - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      # - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}

      # ─── Analytics ────────────────────────────────────────────────────────
      # - NEXT_PUBLIC_GA_ID=${GA_ID}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      # ─── Traefik ──────────────────────────────────────────────────────────
      - "traefik.enable=true"
      # - "traefik.http.routers.my-client.rule=Host(`my-client.paragu-ai.com`)"
      # - "traefik.http.routers.my-client.entrypoints=websecure"
      # - "traefik.http.routers.my-client.tls.certresolver=letsencryptresolver"
      # - "traefik.http.services.my-client.loadbalancer.server.port=3000"
